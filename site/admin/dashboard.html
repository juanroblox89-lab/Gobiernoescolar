<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Dashboard - Gobierno Escolar</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/css/ui.css">
</head>
<body>
  <div class="cargando-panel" id="cargando"><span class="spinner"></span>Cargando panel…</div>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Panel Admin</h2>
        <div class="sidebar-area" id="area-nombre"></div>
        <p class="sidebar-email" id="user-email"></p>
      </div>
      <nav class="sidebar-nav" id="nav" aria-label="Secciones"></nav>
      <div class="sidebar-footer">
        <a class="link-sitio" id="link-sitio" href="/">Ver sitio ↗</a>
        <button class="btn-logout" id="logout-btn">Salir</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="main-inner" id="main"></div>
    </main>
  </div>

  <div class="modal-overlay" id="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="btn-close" type="button" data-cerrar aria-label="Cerrar">&times;</button>
      </div>
      <form id="modal-form" novalidate>
        <div id="modal-campos"></div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-cerrar>Cancelar</button>
          <button type="submit" class="btn-primary btn-auto" id="modal-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/admin/js/admin-dashboard.js"></script>
</body>
</html>
