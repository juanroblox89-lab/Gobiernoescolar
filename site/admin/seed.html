    async function doSeed() {
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('btn-seed');
      btn.disabled = true;
      btn.textContent = 'Cargando...';
      statusEl.textContent = 'Autenticando e iniciando carga de datos...';

        try {

        }

        await setDoc(doc(db, "gobierno", "personeria"), personeriaData);
        await setDoc(doc(db, "gobierno", "contraloria"), contraloriaData);
        await setDoc(doc(db, "gobierno", "pfc"), pfcData);
        statusEl.innerHTML = '<span style="color: green;">¡DATOS CARGADOS CON ÉXITO!</span><br><br>Ya puedes cerrar esta ventana y entrar a tu página web o al panel de administración.';
      } catch (e) {
        statusEl.innerHTML = '<span style="color: red;">Error al sembrar base de datos: ' + e.message + '</span><br><br><small>Si el error es de permisos (permission-denied), asegúrate de que las Reglas de Seguridad en tu consola de Firebase estén configuradas para permitir la lectura pública y escritura por usuarios autenticados.</small>';
        console.error(e);
        btn.disabled = false;
        btn.textContent = '⚠ Cargar datos iniciales';
      }
    }
