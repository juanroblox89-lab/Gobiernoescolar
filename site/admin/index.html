<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin Login - Gobierno Escolar</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/css/ui.css">
</head>
<body class="login-body">
  <div class="login-container" id="login-box">
    <div class="login-header">
      <h1>Panel de Administración</h1>
      <p>Gobierno Escolar 2026</p>
    </div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Usuario o correo</label>
        <input type="text" id="email" name="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="personeria, contraloria o pfc">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="pass-wrap">
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="pass-toggle" id="pass-toggle" aria-label="Mostrar contraseña">Ver</button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Iniciar sesión</button>
      <p id="error-message" class="error-text" role="alert"></p>
    </form>
  </div>
  <script type="module" src="/admin/js/admin-auth.js"></script>
</body>
</html>
