<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Gobierno Escolar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-header">
      <h1>Panel de Administración</h1>
      <p>Gobierno Escolar 2026</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="ejemplo@colegio.edu.co">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Iniciar Sesión</button>
      <p id="error-message" class="error-text"></p>
    </form>
  </div>
  <script type="module" src="js/admin-auth.js"></script>
</body>
</html>
